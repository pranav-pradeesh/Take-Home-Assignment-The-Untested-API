name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Jest (with coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: task-api/package-lock.json

      - run: npm ci
      - run: npm run coverage
